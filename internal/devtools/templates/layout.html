{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · SubGame Devtools</title>
<style>
  :root {
    --bg: #071018;
    --panel: #0d1a24;
    --text: #d5e8f0;
    --muted: #7a9aaa;
    --accent: #3ecfcf;
    --border: #1c3644;
    --warn: #e8a04a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: #09141c;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  header h1 {
    margin: 0;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 650;
  }
  nav { display: flex; gap: 0.25rem; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 0.35rem 0.7rem;
    border-radius: 4px;
  }
  nav a:hover { color: var(--text); background: var(--panel); }
  nav a.active { color: var(--bg); background: var(--accent); }
  main { padding: 1.25rem; max-width: 1400px; }
  form.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    align-items: end;
    margin-bottom: 1.25rem;
    padding: 0.9rem 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  input, select {
    background: #071018;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.4rem 0.55rem;
    font: inherit;
    min-width: 10rem;
  }
  button, .btn {
    background: var(--accent);
    color: var(--bg);
    border: 0;
    border-radius: 4px;
    padding: 0.45rem 0.9rem;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .layout {
    display: grid;
    grid-template-columns: minmax(280px, 340px) 1fr;
    gap: 1.25rem;
    align-items: start;
  }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
  }
  .panel h2 {
    margin: 0 0 0.75rem;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.28rem 0.4rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 550; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .map-wrap { overflow: auto; background: #04080c; border-radius: 6px; border: 1px solid var(--border); padding: 0.5rem; }
  .map-wrap img { image-rendering: pixelated; max-width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.6rem 0 0; font-size: 0.8rem; color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.35rem; vertical-align: middle; }
  .sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; }
  .sound-card audio { width: 100%; margin-top: 0.4rem; }
  .sound-card h3 { margin: 0; font-size: 0.85rem; word-break: break-all; }
  .error { color: #f07178; padding: 0.75rem 1rem; background: #1a1012; border: 1px solid #5a3038; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>SubGame Devtools</h1>
  <nav>
    <a href="/world"{{if eq .Active "world"}} class="active"{{end}}>World</a>
    <a href="/caves"{{if eq .Active "caves"}} class="active"{{end}}>Caves</a>
    <a href="/audio"{{if eq .Active "audio"}} class="active"{{end}}>Audio</a>
  </nav>
</header>
<main>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>
{{end}}
