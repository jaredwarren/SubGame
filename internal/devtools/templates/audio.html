{{define "content"}}
<form class="controls" method="get" action="/audio">
  <label>Seed
    <input type="number" name="seed" id="seed" value="{{.Seed}}" min="0">
  </label>
  <button type="submit">Apply seed</button>
  <span class="muted">First play synthesizes the sound (music loops take a few seconds).</span>
</form>

{{range .Audio.Groups}}
<section class="panel" style="margin-bottom:1rem">
  <h2>{{.Name}} ({{len .Sounds}})</h2>
  <div class="sound-grid">
    {{range .Sounds}}
    <article class="sound-card">
      <h3>{{.Name}}</h3>
      <audio controls preload="none" data-src="/audio/wav?name={{.Name}}" src="/audio/wav?name={{.Name}}&amp;seed={{$.Seed}}"></audio>
    </article>
    {{end}}
  </div>
</section>
{{end}}
<script>
const seedInput = document.getElementById("seed");
function applySeed() {
  const seed = seedInput?.value || "12345";
  document.querySelectorAll("audio").forEach((el) => {
    const base = el.getAttribute("data-src");
    el.src = base + "&seed=" + encodeURIComponent(seed);
  });
}
seedInput?.addEventListener("change", applySeed);
</script>
{{end}}
