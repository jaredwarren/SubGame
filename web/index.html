<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SubGame">
<meta name="description" content="Explore the ocean in SubGame">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>SubGame</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    /* Fill the notch / home-indicator area when installed fullscreen */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas {
    touch-action: none;
  }
  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #7ec8e3;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    text-align: center;
    line-height: 1.5;
    width: min(320px, 90vw);
  }
  #bar {
    margin-top: 14px;
    height: 6px;
    background: #1a2838;
    border-radius: 3px;
    overflow: hidden;
  }
  #bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: #7ec8e3;
    border-radius: 3px;
  }
  #installHint {
    display: none;
    position: absolute;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    color: #7ec8e3aa;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    text-align: center;
    max-width: 90vw;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="loading">
  Loading SubGame&hellip;
  <div id="bar"><i id="barFill"></i></div>
  <div id="pct"></div>
</div>
<div id="installHint"></div>
<script src="wasm_exec.js"></script>
<script>
  // Works for both local serve and GitHub project pages (/SubGame/).
  const base = document.querySelector("base")?.href
    || new URL(".", window.location.href).href;

  function asset(path) {
    return new URL(path, base).href;
  }

  function setProgress(done, total) {
    const fill = document.getElementById("barFill");
    const pct = document.getElementById("pct");
    if (!fill || !pct) return;
    if (!total) {
      pct.textContent = "Downloading…";
      return;
    }
    const p = Math.min(100, Math.round((done / total) * 100));
    fill.style.width = p + "%";
    pct.textContent = p + "% (" + Math.round(done / 1e6) + " / " + Math.round(total / 1e6) + " MB)";
  }

  async function fetchWasm(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status + " fetching " + url);
    const total = Number(res.headers.get("Content-Length")) || 0;
    if (!res.body || !res.body.getReader) {
      setProgress(total, total);
      return res.arrayBuffer();
    }
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      setProgress(received, total);
    }
    const out = new Uint8Array(received);
    let offset = 0;
    for (const c of chunks) {
      out.set(c, offset);
      offset += c.length;
    }
    return out.buffer;
  }

  // Register service worker for installability + caching (HTTPS / localhost only).
  // Note: http://LAN-IP is NOT a secure context — PWA install / standalone won't work there.
  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register(new URL("sw.js", base).href, { scope: new URL("./", base).href })
      .catch((err) => console.warn("SW register failed:", err));
  }

  // Gentle hint when the page is in a normal browser tab (not already installed).
  (function () {
    const standalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches ||
      window.navigator.standalone === true;
    if (standalone) return;
    const hint = document.getElementById("installHint");
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (!window.isSecureContext) {
      hint.textContent = "Open via https:// or http://localhost to install fullscreen";
      hint.style.display = "block";
      return;
    }
    if (isIOS) {
      hint.textContent = "Safari → Share → Add to Home Screen (then open the icon)";
      hint.style.display = "block";
    } else if (isAndroid) {
      hint.textContent = "Chrome menu → Install app (not “Add to bookmarks”)";
      hint.style.display = "block";
    }
    setTimeout(() => { hint.style.display = "none"; }, 10000);
  })();

  (async () => {
    const go = new Go();
    // Prefer cacheable URL (service worker stores game.wasm); bump ?v= when you redeploy a new binary.
    const wasmURL = asset("game.wasm") + "?v=1";
    try {
      const bytes = await fetchWasm(wasmURL);
      document.getElementById("pct").textContent = "Compiling…";
      const result = await WebAssembly.instantiate(bytes, go.importObject);
      document.getElementById("loading").remove();
      document.getElementById("installHint")?.remove();
      go.run(result.instance);
    } catch (err) {
      const el = document.getElementById("loading");
      el.textContent = "Failed to load: " + err;
    }
  })();
</script>
</body>
</html>
